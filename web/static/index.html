<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Health Monitor</title>
    <link rel="stylesheet" href="/static/css/tokens.css">
    <link rel="stylesheet" href="/static/css/app.css">
    <script>
        // Apply the saved theme before first paint to avoid a flash.
        (function () {
            try {
                var t = localStorage.getItem('hm-theme');
                if (t === 'light' || t === 'makima') document.documentElement.setAttribute('data-theme', t);
            } catch (_) {}
        })();
    </script>
</head>
<body>
    <header class="hm-topbar">
        <span class="hm-brand">
            <span class="hm-brand-mark" id="brandMark"></span>
            Health Monitor
        </span>
        <div class="hm-seg" role="tablist" aria-label="Section" id="tabSeg"></div>
        <span style="flex: 1;"></span>
        <span class="hm-live" data-state="polling" id="liveIndicator" role="status">
            <span class="hm-dot"></span><span id="liveLabel">Connecting…</span>
        </span>
        <button type="button" class="hm-iconbtn" id="themeBtn" aria-label="Switch theme"></button>
        <button type="button" class="hm-iconbtn" id="logoutBtn" aria-label="Sign out" title="Sign out" hidden></button>
        <button type="button" class="hm-btn hm-btn--primary" id="addTargetBtn">
            <span id="addTargetIcon"></span><span class="hm-topbar-add-label">Add target</span>
        </button>
    </header>

    <main class="hm-shell">
        <div id="view-dashboard">
            <div id="hero" role="status" aria-live="polite"></div>
            <div class="hm-statrow" id="statrow"></div>
            <div id="ongoing"></div>

            <div class="hm-toolbar">
                <div class="hm-search">
                    <span id="searchIcon"></span>
                    <input class="hm-input" id="searchInput" placeholder="Search targets, tags…" aria-label="Search targets">
                </div>
                <div class="hm-seg" role="tablist" aria-label="Status filter" id="filterSeg"></div>
                <span style="flex: 1;"></span>
                <select class="hm-select hm-select--inline" id="sortSelect" aria-label="Sort targets">
                    <option value="status">Sort: status</option>
                    <option value="name">Sort: name</option>
                    <option value="uptime">Sort: uptime</option>
                    <option value="response">Sort: response time</option>
                </select>
                <div class="hm-seg" role="tablist" aria-label="View" id="viewSeg"></div>
            </div>

            <div id="targets"></div>

            <div class="hm-sectionhead">
                <h2>Incident history</h2>
                <span style="flex: 1;"></span>
                <button type="button" class="hm-btn hm-btn--ghost" id="resolvedToggle"></button>
            </div>
            <div id="resolved" hidden></div>

            <div class="hm-foot">
                <span>Last updated <span class="num" id="lastUpdated">—</span></span>
                <span>·</span>
                <span>auto-refresh 30s</span>
            </div>
        </div>

        <div id="view-notifiers" hidden>
            <div class="hm-sectionhead" style="margin-top: var(--space-6);">
                <h2>Notifiers</h2>
                <span style="flex: 1;"></span>
                <button type="button" class="hm-btn hm-btn--primary" id="addNotifierBtn"></button>
            </div>
            <p style="margin: 0 0 var(--space-3); color: var(--text-2); font-size: var(--text-md); max-width: 560px;">
                Alert channels for down / recovered / slow-response events. Rarely touched — they live here, out of the way of live status.
            </p>
            <div id="notifiers"></div>
        </div>
    </main>

    <div id="overlay"></div>
    <div class="hm-toaststack" id="toasts" aria-live="polite"></div>

    <script src="/static/js/app.js"></script>
</body>
</html>
