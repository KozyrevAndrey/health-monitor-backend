<!-- @dsCard group="Screens" viewport="1440x800" name="v2 Login — Makima theme" subtitle="Concentric-ring control mark, crimson primary, obedient copy" -->
<!DOCTYPE html>
<html lang="en" data-theme="makima">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Health Monitor — Sign in (v2)</title>
<link rel="stylesheet" href="../../styles.css">
<link rel="stylesheet" href="app.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  .login-stage { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--space-4); padding: var(--space-5); position: relative; }
  /* faint outermost ring behind the card — being watched, quietly */
  .login-stage::before {
    content: ""; position: absolute; width: 560px; height: 560px; border-radius: 50%;
    border: 1px solid var(--accent-border); opacity: 0.14; pointer-events: none;
  }
  .login-stage::after {
    content: ""; position: absolute; width: 760px; height: 760px; border-radius: 50%;
    border: 1px solid var(--accent-border); opacity: 0.07; pointer-events: none;
  }
  .login-card { width: min(380px, 100%); padding: var(--space-8) var(--space-6) var(--space-6); display: flex; flex-direction: column; gap: var(--space-4); position: relative; z-index: 1; }
  .login-brand { display: flex; flex-direction: column; align-items: center; gap: var(--space-3); text-align: center; }
  .login-rings {
    width: 48px; height: 48px; border-radius: 50%;
    background: radial-gradient(circle,
      var(--accent) 0 3px, transparent 3.5px 8px,
      var(--accent-border) 8px 9px, transparent 9.5px 15px,
      var(--accent-border) 15px 16px, transparent 16.5px 22px,
      var(--border-2) 22px 23px, transparent 23.5px);
  }
  .login-banner { display: flex; gap: var(--space-2); align-items: flex-start; padding: var(--space-2) var(--space-3); border-radius: var(--radius-md); font-size: var(--text-sm); background: var(--status-down-subtle); border: 1px solid var(--status-down-border); color: var(--status-down); }
  @media (max-width: 640px) { .login-card { padding: var(--space-6) var(--space-4) var(--space-4); } .login-stage::before, .login-stage::after { display: none; } }
</style>
</head>
<body>
<div id="root" data-screen-label="v2 Login — Makima theme"></div>
<script type="text/babel">
const { Icon, Button, TextField } = window.HealthMonitorRedesign_502b6f;

function Login() {
  const [password, setPassword] = React.useState("");
  const [error, setError] = React.useState("");
  const [failed, setFailed] = React.useState(false);
  const [busy, setBusy] = React.useState(false);

  const submit = (e) => {
    e.preventDefault();
    if (!password) { setError("Enter your password"); return; }
    setError("");
    setBusy(true);
    setTimeout(() => { setBusy(false); setFailed(true); setPassword(""); }, 600);
  };

  return (
    <div className="login-stage">
      <form className="hm-card login-card" onSubmit={submit}>
        <div className="login-brand">
          <span className="login-rings" aria-hidden="true"></span>
          <div>
            <b style={{ display: "block", fontSize: "var(--text-2xl)", fontWeight: "var(--weight-semibold)", letterSpacing: "0.01em" }}>Health Monitor</b>
            <span style={{ fontSize: "var(--text-md)", color: "var(--text-2)" }}>Everything here is under control.</span>
          </div>
        </div>

        {failed && (
          <div className="login-banner" role="alert">
            <Icon name="alert-triangle" size={14} style={{ marginTop: 1 }} />
            <span>Wrong password. Check <code style={{ fontSize: "var(--text-xs)" }}>--auth-password</code> or your config file.</span>
          </div>
        )}

        <TextField
          label="Password"
          type="password"
          placeholder="••••••••••••"
          value={password}
          error={error}
          hint={error ? undefined : "Set at startup via flag, env var or config"}
          onChange={(e) => { setPassword(e.target.value); if (error) setError(""); }}
        />

        <Button variant="primary" size="lg" type="submit" disabled={busy} style={{ width: "100%" }}>
          {busy ? "Signing in…" : "Sign in"}
        </Button>

        <label style={{ display: "flex", alignItems: "center", gap: "var(--space-2)", fontSize: "var(--text-sm)", color: "var(--text-2)", cursor: "pointer" }}>
          <input type="checkbox" defaultChecked style={{ accentColor: "var(--accent)", width: 14, height: 14, margin: 0 }} />
          Keep this device under watch for 30 days
        </label>
      </form>

      <span style={{ fontSize: "var(--text-sm)", color: "var(--text-3)" }} className="num">Health Monitor v2.0 · self-hosted</span>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<Login />);
</script>
</body>
</html>
