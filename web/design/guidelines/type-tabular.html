<!-- @dsCard group="Type" viewport="700x130" name="Tabular numerals" subtitle=".num — metrics never jitter as they update live" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 16px 24px; display: flex; gap: 32px; align-items: center; }
  .col { display: flex; flex-direction: column; gap: 2px; }
</style></head>
<body>
  <div class="col">
    <span class="overline">Proportional (wrong)</span>
    <span style="font-size: 18px;">111.11 ms</span>
    <span style="font-size: 18px;">807.94 ms</span>
  </div>
  <div class="col">
    <span class="overline">Tabular .num (right)</span>
    <span class="num" style="font-size: 18px;">111.11 ms</span>
    <span class="num" style="font-size: 18px;">807.94 ms</span>
  </div>
  <div class="col" style="color: var(--text-2); font-size: 12px; max-width: 240px;">
    Every live metric — uptime %, response times, counts — uses <code>.num</code> (JetBrains Mono, tabular-nums).
  </div>
</body></html>
