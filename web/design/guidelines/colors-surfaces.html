<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body { display: flex; gap: 8px; padding: 16px; align-items: stretch; }
  .sw { flex: 1; border: 1px solid var(--border-1); border-radius: var(--radius-md); padding: 10px; display: flex; flex-direction: column; justify-content: flex-end; gap: 2px; min-height: 100px; }
  .sw b { font-size: 12px; font-weight: 600; }
  .sw code { font-size: 10px; color: var(--text-3); }
</style></head>
<body>
  <div class="sw" style="background: var(--bg-inset);"><b>--bg-inset</b><code>#0a0e13</code></div>
  <div class="sw" style="background: var(--bg-0);"><b>--bg-0</b><code>#0d1117 · page</code></div>
  <div class="sw" style="background: var(--bg-1);"><b>--bg-1</b><code>#161b22 · card</code></div>
  <div class="sw" style="background: var(--bg-2);"><b>--bg-2</b><code>#1d2430 · hover</code></div>
  <div class="sw" style="background: var(--bg-3);"><b>--bg-3</b><code>#252d3b · active</code></div>
</body></html>
