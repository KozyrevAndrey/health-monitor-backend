<!-- @dsCard group="Spacing" viewport="700x140" name="4px scale" subtitle="--space-1…12 — everything sits on the 4px grid" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 16px 24px; display: flex; gap: 12px; align-items: flex-end; }
  .bar { background: var(--accent-subtle); border: 1px solid var(--accent-border); border-radius: 3px; width: 40px; }
  .cell { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  code { font-size: 10px; color: var(--text-3); }
</style></head>
<body>
  <div class="cell"><div class="bar" style="height: 4px;"></div><code>1·4</code></div>
  <div class="cell"><div class="bar" style="height: 8px;"></div><code>2·8</code></div>
  <div class="cell"><div class="bar" style="height: 12px;"></div><code>3·12</code></div>
  <div class="cell"><div class="bar" style="height: 16px;"></div><code>4·16</code></div>
  <div class="cell"><div class="bar" style="height: 20px;"></div><code>5·20</code></div>
  <div class="cell"><div class="bar" style="height: 24px;"></div><code>6·24</code></div>
  <div class="cell"><div class="bar" style="height: 32px;"></div><code>8·32</code></div>
  <div class="cell"><div class="bar" style="height: 40px;"></div><code>10·40</code></div>
  <div class="cell"><div class="bar" style="height: 48px;"></div><code>12·48</code></div>
</body></html>
