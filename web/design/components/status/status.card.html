<!-- @dsCard group="Components" viewport="700x290" name="Status primitives" subtitle="Dot · badge · tick bar · sparkline · live indicator" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
</head>
<body style="padding: 16px 20px;">
<div id="root"></div>
<script type="text/babel">
const { StatusDot, StatusBadge, TickBar, Sparkline, LiveIndicator } = window.HealthMonitorRedesign_502b6f;
const checks = Array.from({ length: 45 }, (_, i) => ({
  s: i === 28 || i === 29 ? "down" : i === 35 ? "degraded" : "up",
  tip: `12:${String(10 + i).padStart(2, "0")} · ${i === 28 || i === 29 ? "timeout" : (140 + ((i * 37) % 220)) + " ms"}`,
}));
const row = { display: "flex", alignItems: "center", gap: 16, padding: "7px 0" };
function Demo() {
  return (
    <div>
      <div style={row}>
        <StatusDot status="up" /><StatusDot status="degraded" /><StatusDot status="unknown" /><StatusDot status="down" pulse />
        <span style={{ color: "var(--text-3)", fontSize: 12 }}>dots · pulse = ongoing down</span>
      </div>
      <div style={row}>
        <StatusBadge status="up" label="Operational" /><StatusBadge status="down" /><StatusBadge status="degraded" /><StatusBadge status="unknown" label="Paused" />
      </div>
      <div style={{ padding: "7px 0" }}>
        <TickBar checks={checks} slots={45} />
        <div style={{ fontSize: 11, color: "var(--text-3)", marginTop: 4 }}>last 45 checks · hover for time + latency</div>
      </div>
      <div style={row}>
        <Sparkline points={[120, 180, 140, 210, 130, 460, 180, 150, 140, 170, 120, 190]} width={160} height={30} />
        <LiveIndicator state="live" /><LiveIndicator state="reconnecting" /><LiveIndicator state="polling" />
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
</body></html>
