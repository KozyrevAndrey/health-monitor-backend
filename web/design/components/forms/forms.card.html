<!-- @dsCard group="Components" viewport="700x430" name="Form controls" subtitle="Buttons · fields · switch · segmented · tags · duration" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
</head>
<body style="padding: 16px 20px;">
<div id="root"></div>
<script type="text/babel">
const { Button, IconButton, TextField, SelectField, Switch, Segmented, TagInput, DurationField, Icon } = window.HealthMonitorRedesign_502b6f;
function Demo() {
  const [period, setPeriod] = React.useState("24h");
  const [view, setView] = React.useState("cards");
  const [on, setOn] = React.useState(true);
  const [tags, setTags] = React.useState(["prod", "api"]);
  const [dur, setDur] = React.useState("1m");
  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
      <div style={{ display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap" }}>
        <Button variant="primary" icon={<Icon name="plus" size={15} />}>Add target</Button>
        <Button>Cancel</Button>
        <Button variant="danger" icon={<Icon name="trash" size={14} />}>Delete</Button>
        <Button variant="ghost">Ghost</Button>
        <Button disabled>Disabled</Button>
        <IconButton name="pencil" label="Edit" />
        <IconButton name="trash" label="Delete" danger />
      </div>
      <div style={{ display: "flex", gap: 12, alignItems: "center", flexWrap: "wrap" }}>
        <Segmented options={["24h", "7d", "30d"]} value={period} onChange={setPeriod} ariaLabel="Period" />
        <Segmented options={[{ value: "cards", label: "Cards", icon: <Icon name="grid" size={12} /> }, { value: "table", label: "Table", icon: <Icon name="list" size={12} /> }]} value={view} onChange={setView} ariaLabel="View" />
        <Switch checked={on} onChange={setOn} label="Enabled" />
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>
        <TextField label="Name" placeholder="API /health" hint="Shown on the dashboard" />
        <SelectField label="DNS record" options={["A", "AAAA", "CNAME", "MX", "TXT"]} />
        <TextField label="URL" mono defaultValue="api.example.dev/health" error="Must start with http(s)://" />
        <div className="hm-field"><span className="hm-label">Tags</span><TagInput value={tags} onChange={setTags} /></div>
      </div>
      <DurationField label="Check interval" value={dur} onChange={setDur} hint="How often this target is checked" />
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
</body></html>
