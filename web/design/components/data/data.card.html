<!-- @dsCard group="Components" viewport="700x560" name="Data display" subtitle="Stat card · target card · table row · incident · notifier" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
</head>
<body style="padding: 16px 20px;">
<div id="root"></div>
<script type="text/babel">
const { StatCard, TargetCard, TargetTable, IncidentItem, NotifierRow } = window.HealthMonitorRedesign_502b6f;
const mk = (fail) => Array.from({ length: 45 }, (_, i) => ({
  s: fail && i > 41 ? "down" : "up",
  tip: `12:${String(10 + i).padStart(2, "0")} · ${fail && i > 41 ? "HTTP 503" : (140 + ((i * 37) % 200)) + " ms"}`,
}));
function Demo() {
  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 8 }}>
        <StatCard label="Targets" value={12} sub="11 enabled" />
        <StatCard label="Failing" value={1} tone="danger" sub="Postgres primary" />
        <StatCard label="Avg response" value={187} unit="ms" sub="24h" />
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8 }}>
        <TargetCard target={{ name: "API /health", type: "http", status: "up", checks: mk(false), uptime: "99.98", lastMs: 187, endpoint: "https://api.example.dev/health" }} onEdit={() => {}} onDelete={() => {}} />
        <TargetCard target={{ name: "Postgres primary", type: "tcp", status: "down", checks: mk(true), uptime: "97.10", lastMs: null, endpoint: "10.0.4.2:5432" }} onEdit={() => {}} onDelete={() => {}} />
      </div>
      <div className="hm-card" style={{ overflow: "hidden" }}>
        <TargetTable targets={[
          { name: "API /health", type: "http", status: "up", checks: mk(false), uptime: "99.98", lastMs: 187 },
          { name: "Postgres primary", type: "tcp", status: "down", checks: mk(true), uptime: "97.10", lastMs: null },
        ]} onEdit={() => {}} onDelete={() => {}} />
      </div>
      <div className="hm-card">
        <IncidentItem incident={{ target: "Postgres primary", status: "ongoing", severity: "critical", startedAt: "Started 09:14", duration: "23m", failureCount: 14, lastError: "dial tcp 10.0.4.2:5432: i/o timeout" }} />
        <IncidentItem incident={{ target: "Marketing site", status: "resolved", severity: "warning", startedAt: "8 Jul, 22:03", duration: "4m", failureCount: 3 }} last />
      </div>
      <div className="hm-card">
        <NotifierRow notifier={{ name: "Ops channel", type: "telegram", enabled: true, detail: "chat •••4821" }} onToggle={() => {}} onEdit={() => {}} onDelete={() => {}} />
        <div style={{ borderTop: "1px solid var(--border-1)" }}></div>
        <NotifierRow notifier={{ name: "Fallback email", type: "email", enabled: false, detail: "ops@•••.dev" }} onToggle={() => {}} onEdit={() => {}} onDelete={() => {}} />
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
</body></html>
