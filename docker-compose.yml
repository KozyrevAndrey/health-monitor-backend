  #     POSTGRES_PASSWORD: changeme
  #   volumes:
  #     - postgres-data:/var/lib/postgresql/data
  #   ports:
  #     - "5432:5432"
  #   networks:
  #     - health-monitor-network
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U healthmon"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5

networks:
  health-monitor-network:
    driver: bridge

