run:
  timeout: 5m
  tests: true
  modules-download-mode: readonly

linters:
  enable:
    # Enabled by default
    - errcheck      # Check for unchecked errors
    - gosimple      # Simplify code
    - govet         # Vet examines Go source code
    - ineffassign   # Detect ineffectual assignments
    - staticcheck   # Advanced Go linter
    - unused        # Check for unused constants, variables, functions and types

    # Additional recommended linters
    - gofmt         # Check whether code was gofmt-ed
    - goimports     # Check import statements are formatted
    - misspell      # Finds commonly misspelled English words
    - unconvert     # Remove unnecessary type conversions
    - unparam       # Reports unused function parameters
    - gosec         # Security-focused linter
    - bodyclose     # Check whether HTTP response body is closed
    - noctx         # Find sending HTTP requests without context.Context
    - sqlclosecheck # Check sql.Rows and sql.Stmt are closed
    - contextcheck  # Check context is passed correctly
    - errname       # Check that sentinel errors are prefixed with Err
    - errorlint     # Find code that will cause problems with Go 1.13 error wrapping
    - gocyclo       # Check cyclomatic complexity
    - goconst       # Find repeated strings that could be constants
    - gocritic      # Comprehensive Go linter
    - revive        # Fast, configurable, extensible linter
    - stylecheck    # Replacement for golint

linters-settings:
  errcheck:
    check-type-assertions: true
    check-blank: true

  govet:
    enable:
      - shadow

  gocyclo:
    min-complexity: 15

  goconst:
    min-len: 3
    min-occurrences: 3

  misspell:
    locale: US

  gocritic:
    enabled-tags:
      - diagnostic
      - experimental
      - opinionated
      - performance
      - style
    disabled-checks:
      - whyNoLint
      - unnamedResult

  revive:
    rules:
      - name: exported
        disabled: false
      - name: package-comments
        disabled: true
      - name: unexported-return
        disabled: false

  stylecheck:
    checks: ["all", "-ST1000", "-ST1003", "-ST1016"]

issues:
  exclude-rules:
    # Exclude some linters from running on tests files
    - path: _test\.go
      linters:
        - gocyclo
        - errcheck
        - gosec
        - goconst

    # Exclude TODO comments from being flagged
    - linters:
        - godox
      text: "TODO"

  # Maximum issues count per one linter
  max-issues-per-linter: 0

  # Maximum count of issues with the same text
  max-same-issues: 0

  # Show all issues
  exclude-use-default: false
