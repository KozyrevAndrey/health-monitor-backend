name: Test

on:
  push:
    branches: [main]
  pull_request:

# SQLite (go-sqlite3) requires CGO; ubuntu-latest ships gcc so the native
# toolchain works out of the box.
env:
  CGO_ENABLED: "1"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      # -short skips tests that hit external network (e.g. the HTTP checker's
      # live-endpoint test); -race needs CGO, which is enabled above.
      - name: Test
        run: go test -short -race ./...

  # Advisory: the strict .golangci.yml surfaces ~200 mostly-stylistic findings
  # against a codebase not previously linted, so lint reports but does not block
  # CI. Tighten/clean up incrementally, then flip continue-on-error to false.
  lint:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Pinned (not "latest"): golangci-lint v2 changed the config schema and
      # would reject this v1-style .golangci.yml.
      - uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.8
          args: --timeout=5m
