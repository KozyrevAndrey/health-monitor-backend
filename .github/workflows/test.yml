name: Test

on:
  push:
    branches: [main]
  pull_request:

# SQLite (go-sqlite3) requires CGO; ubuntu-latest ships gcc so the native
# toolchain works out of the box.
env:
  CGO_ENABLED: "1"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      # -short skips tests that hit external network (e.g. the HTTP checker's
      # live-endpoint test); -race needs CGO, which is enabled above.
      - name: Test
        run: go test -short -race ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m
