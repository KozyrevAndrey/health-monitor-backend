name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub Release and upload the binary
  packages: write # push the image to GHCR

jobs:
  # Build and push the Docker image to GitHub Container Registry.
  # The image name is derived from the repo owner and lowercased by
  # docker/metadata-action (GHCR requires lowercase).
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # built-in, no PAT needed

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/health-monitor
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64 # Dockerfile builds GOARCH=amd64 with CGO
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # Build a native linux/amd64 binary and attach it to the GitHub Release.
  binary:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build binary
        run: |
          go build -ldflags="-s -w" -o health-monitor-linux-amd64 ./cmd/server

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: health-monitor-linux-amd64
          generate_release_notes: true
