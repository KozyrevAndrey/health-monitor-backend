# Health Monitor Configuration Example

server:
  host: "0.0.0.0"
  port: 8080
  read_timeout: 15s
  write_timeout: 15s
  shutdown_timeout: 30s
  enable_auth: false
  # Credentials for the web login form (required when enable_auth is true)
  # auth_user: "admin"
  # auth_pass: "password"

database:
  type: "sqlite"
  path: "./data/health-monitor.db"
  max_open_conns: 25
  max_idle_conns: 5
  conn_max_lifetime: 5m

logging:
  level: "info"  # debug, info, warn, error
  format: "json" # json, console
  output: "stdout" # stdout, stderr, or file path

retention:
  check_results: 720h    # 30 days
  incidents: 2160h       # 90 days
  cleanup_interval: 24h  # daily cleanup

# Targets and notifiers are managed via the web UI / REST API.
# Use GET/POST /api/v1/targets and /api/v1/notifiers to configure them.