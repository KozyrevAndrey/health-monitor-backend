version: '3.8'

services:
  health-monitor:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-latest}
    container_name: health-monitor-prod
    image: health-monitor:prod
    expose:
      - "8080"
    volumes:
      - ./configs:/configs:ro
      - health-monitor-data:/data
      # secrets/ is writable so Gmail OAuth can persist refreshed tokens
      - ./secrets:/app/secrets
    environment:
      - HEALTH_MONITOR_SERVER_HOST=0.0.0.0
      - HEALTH_MONITOR_SERVER_PORT=8080
      - HEALTH_MONITOR_LOGGING_LEVEL=info
      - HEALTH_MONITOR_LOGGING_FORMAT=json
      - HEALTH_MONITOR_DATABASE_PATH=/data/health-monitor.db
      # Uncomment to enable Basic Auth for the dashboard
      # - HEALTH_MONITOR_SERVER_ENABLE_AUTH=true
      # - HEALTH_MONITOR_SERVER_BASIC_AUTH_USER=${BASIC_AUTH_USER:-admin}
      # - HEALTH_MONITOR_SERVER_BASIC_AUTH_PASS=${BASIC_AUTH_PASS}
    restart: unless-stopped
    networks:
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"
      # HTTP (Traefik globally redirects HTTP→HTTPS via entrypoint config)
      - "traefik.http.routers.health-monitor-http.rule=Host(`monitor.yourdomain.ru`)"
      - "traefik.http.routers.health-monitor-http.entrypoints=web"
      # HTTPS
      - "traefik.http.routers.health-monitor-https.rule=Host(`monitor.yourdomain.ru`)"
      - "traefik.http.routers.health-monitor-https.entrypoints=websecure"
      - "traefik.http.routers.health-monitor-https.tls=true"
      - "traefik.http.routers.health-monitor-https.tls.certresolver=letsencrypt"
      - "traefik.http.services.health-monitor.loadbalancer.server.port=8080"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  traefik-public:
    external: true

volumes:
  health-monitor-data:
